<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Prompt - Prompt Builder Beta Version</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container-fluid">
  <a class="navbar-brand fw-bold" href="../index.html">Prompt Builder <span class="version-badge">Beta Version</span></a>
  <button class="btn btn-outline-light btn-sm" id="themeToggle">Light / Dark</button>
</div></nav>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div><h2 class="mb-1">Final Prompt</h2><div class="text-secondary small">Expanded prompt including pace, continuity, dialogue and audio mix.</div></div>
    <a class="btn btn-outline-secondary" href="builder.html">← Edit Selections</a>
  </div>
  <div class="card rounded-4 shadow-sm"><div class="card-body p-4">
    <textarea id="finalPrompt" class="form-control" rows="28"></textarea>
    <div class="d-flex flex-wrap gap-2 mt-3">
      <button class="btn btn-primary" id="copyBtn">Copy Prompt</button>
      <button class="btn btn-outline-secondary" id="saveTxtBtn">Save Prompt As...</button>
      <button class="btn btn-outline-primary" id="saveProjectBtn">Save Project in Browser</button>
      <a class="btn btn-outline-info" href="scenes.html">Beginning / End Scenes</a>
      <a class="btn btn-outline-dark ms-lg-auto" href="../index.html">Home</a>
    </div>
  </div></div>
</main>
<script src="../javascript/file-save.js"></script><script src="../javascript/storage.js"></script>
<script src="../javascript/prompt-generator.js"></script><script src="../javascript/config.js"></script><script src="../javascript/site-services.js"></script><script src="../javascript/app.js"></script>
<script>
const project=PBStorage.loadDraft();
const promptText=project?.finalPrompt || (project?PBPromptGenerator.final(project):"");
document.getElementById("finalPrompt").value=promptText;
document.getElementById("copyBtn").onclick=async()=>{
  const ok=await PBFile.copyText(document.getElementById("finalPrompt").value);
  alert(ok?"Prompt copied to clipboard.":"Could not copy automatically.");
};
document.getElementById("saveTxtBtn").onclick=async()=>{
  const text=document.getElementById("finalPrompt").value;
  const name=(project?.projectName||"prompt").replace(/[^\w-]+/g,"-")+".txt";
  await PBFile.saveText(text,name,"text/plain");
};
document.getElementById("saveProjectBtn").onclick=()=>{if(!project)return;project.finalPrompt=document.getElementById("finalPrompt").value;PBStorage.saveDraft(project);PBStorage.addSavedProject(project);alert("Project saved in this browser.");};
</script></body></html>
