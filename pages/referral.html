<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Designer Inquiry · Beta Version</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><main class="container py-4"><div class="brand-section mb-4"><h1 class="h2">Website Designer Inquiry</h1><p class="mb-0">Request information, a quote, or access to the featured website builder. Your message is sent directly through the site's secure service when available.</p></div><div class="card rounded-4"><div class="card-body p-4"><form id="referralForm"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="fullName">Full Name</label><input id="fullName" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="email">Email Address</label><input id="email" type="email" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="phone">Phone Number</label><input id="phone" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="preferredDateTime">Preferred Date and Time to Contact You</label><input id="preferredDateTime" type="datetime-local" class="form-control" required></div></div><label class="form-label mt-3" for="requestText">Request</label><textarea id="requestText" class="form-control" rows="5">Hi, I'm requesting a quote and access to your website builder. Can you send me information, please? Thanks.</textarea><div class="mt-3 d-flex gap-2"><button class="btn pb-button" type="submit">Send Inquiry</button><span id="sendStatus" class="align-self-center small-note"></span></div></form></div></div></main><script src="../javascript/config.js"></script><script src="../javascript/site-services.js"></script><script src="../javascript/app.js"></script><script>referralForm.addEventListener('submit',async e=>{e.preventDefault();sendStatus.textContent='Sending…';try{await PBSiteServices.sendJSON('referral',{fullName:fullName.value,email:email.value,phone:phone.value,preferredDateTime:preferredDateTime.value,request:requestText.value,subject:'Maven Website Builder Inquiry'});sendStatus.textContent='Inquiry sent successfully.';referralForm.reset();}catch(err){sendStatus.textContent=err.message;}});</script></body></html>
