<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review - Prompt Builder Beta Version</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container-fluid">
  <a class="navbar-brand fw-bold" href="../index.html">Prompt Builder <span class="version-badge">Beta Version</span></a>
  <button class="btn btn-outline-light btn-sm" id="themeToggle">Light / Dark</button>
</div></nav>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div><h2 class="mb-1">Review Project</h2><div class="text-secondary small" id="completionText"></div></div>
    <a class="btn btn-outline-secondary" href="builder.html">← Edit Selections</a>
  </div>
  <div class="card rounded-4 shadow-sm"><div class="card-body p-4">
    <div id="warnings" class="mb-3"></div><div id="reviewContent"></div>
    <div class="d-flex flex-wrap gap-2 mt-4">
      <button class="btn btn-outline-danger" id="rejectBtn">Reject / Return to Editor</button>
      <button class="btn btn-outline-primary" id="saveBtn">Save Project in Browser</button>
      <button class="btn btn-outline-secondary" id="exportBtn">Save Project JSON As...</button>
      <a class="btn btn-outline-info" href="scenes.html">Kling Beginning / End Scenes</a>
      <button class="btn btn-success ms-lg-auto" id="approveBtn">Approve & Generate Prompt</button>
    </div>
  </div></div>
</main>
<script src="../javascript/file-save.js"></script><script src="../javascript/storage.js"></script>
<script src="../javascript/prompt-generator.js"></script><script src="../javascript/config.js"></script><script src="../javascript/site-services.js"></script><script src="../javascript/app.js"></script>
<script>
const project=PBStorage.loadDraft();
if(!project){document.getElementById("reviewContent").innerHTML='<div class="alert alert-warning">No current draft found.</div>';}
else{
  const required=[["Project Name",project.projectName],["Theme",project.selections?.theme],["Type",project.selections?.type]];
  const missing=required.filter(([_,v])=>!v||v==="Select an option"||v==="No value");
  const completion=Math.round(((required.length-missing.length)/required.length)*100);
  document.getElementById("completionText").textContent=`Required field completion: ${completion}%`;
  document.getElementById("warnings").innerHTML=missing.length?
    `<div class="alert alert-warning">Missing required fields: ${missing.map(x=>x[0]).join(", ")}</div>`:
    `<div class="alert alert-success">All required fields are complete.</div>`;
  const t=PBPromptGenerator.structured(project)||"No selections found.";
  document.getElementById("reviewContent").innerHTML=`<pre style="white-space:pre-wrap;font-family:inherit;margin:0">${t.replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]))}</pre>`;
}
document.getElementById("rejectBtn").onclick=()=>{const reason=prompt("Optional: Why are you rejecting this version?");if(project){project.rejectionReason=reason||"";PBStorage.saveDraft(project);}location.href="builder.html";};
document.getElementById("saveBtn").onclick=()=>{if(!project)return;const saved=PBStorage.addSavedProject(project);PBStorage.saveDraft(saved);alert("Project saved in this browser.");};
document.getElementById("exportBtn").onclick=async()=>{if(project) await PBStorage.exportJSON(project);};
document.getElementById("approveBtn").onclick=()=>{if(!project)return;project.finalPrompt=PBPromptGenerator.final(project);project.approved=true;PBStorage.saveDraft(project);PBStorage.addSavedProject(project);location.href="prompt.html";};
</script></body></html>
